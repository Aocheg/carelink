services:
  db:
    image: postgres:16-alpine
    container_name: carelink_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carelink_db}
      POSTGRES_USER: ${POSTGRES_USER:-carelink_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carelink_secure_password_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carelink_user} -d ${POSTGRES_DB:-carelink_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ./carelink
      dockerfile: Dockerfile
    container_name: carelink_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-carelink_user}:${POSTGRES_PASSWORD:-carelink_secure_password_2026}@db:5432/${POSTGRES_DB:-carelink_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-carelink-production-docker-secret-key-32bytes-secure}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "${PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
