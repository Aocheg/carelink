services:
  - type: web
    name: carelink
    runtime: python
    rootDir: carelink
    buildCommand: pip install -r requirements.txt && alembic upgrade head && python -m app.database.seed
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./carelink.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "true"
      - key: PYTHON_VERSION
        value: 3.12.3
